<component-layout-portal-navigator title="Brands" subtitle="Browse, filter, and manage brands">
  <a routerLink="/portal/brands/create" class="btn btn-primary">Create Brand</a>
</component-layout-portal-navigator>

<div class="container-custom py-6">
  <div class="bg-white shadow-sm rounded-lg overflow-hidden">
    <div class="p-4 border-b border-gray-300">
      <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
        <!-- Search & Filter -->
        <div class="flex flex-col sm:flex-row gap-4">
          <div class="w-full sm:w-64">
            <label for="search" class="sr-only">Search</label>
            <div class="relative rounded-md shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="text-gray-500 sm:text-sm">🔍</span>
              </div>

              <input
                type="text"
                name="search"
                id="search"
                [(ngModel)]="searchQuery"
                (ngModelChange)="onSearch()"
                class="focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md py-2 border"
                placeholder="Search brands"
              />
            </div>
          </div>

          <div class="w-full sm:w-40">
            <label for="country" class="sr-only">Filter by Country</label>
            <select
              id="country"
              name="country"
              [(ngModel)]="selectedCountry"
              (ngModelChange)="onFilterByCountry()"
              class="form-input py-2"
            >
              <option value="">All Countries</option>
              <option *ngFor="let country of countries" [value]="country.code">
                {{ country.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center space-x-2">
          <button
            [disabled]="selectedBrands.length === 0"
            (click)="onDeleteSelected()"
            class="btn btn-danger btn-sm cursor-pointer"
            [class.opacity-50]="selectedBrands.length === 0"
          >Delete Selected</button>
        </div>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-300">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 w-10">
              <div class="flex items-center">
                <input
                  id="selectAll"
                  type="checkbox"
                  [checked]="areAllSelected()"
                  (change)="toggleSelectAll()"
                  class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded"
                />
              </div>
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Brand</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Country</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rating</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>

        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngIf="loading" class="animate-pulse">
            <td colspan="6" class="p-4 text-center text-gray-500">Loading brands...</td>
          </tr>

          <tr *ngIf="!loading && errorMessage" class="hover:bg-gray-50">
            <td colspan="6" class="p-4 text-center text-gray-500">
              {{ errorMessage }} Try adjusting your filters or <a routerLink="/portal/brands/create" class="text-blue-600">add a new brand</a>.
            </td>
          </tr>

          <tr *ngFor="let brand of filteredBrands" class="hover:bg-gray-50 transition duration-150">
            <td class="px-6 py-4 whitespace-nowrap">
              <input
                type="checkbox"
                [checked]="isSelected(brand)"
                (change)="toggleSelect(brand)"
                class="focus:ring-blue-500 h-4 w-4 text-blue-600 border-gray-300 rounded"
              />
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div class="flex-shrink-0">
                  <component-image [brandName]="brand.name" [size]="'sm'" [imageSrc]="brand.image_url"></component-image>
                </div>

                <div class="ml-4">
                  <div class="text-sm font-medium text-gray-900"><a [routerLink]="'/portal/brands/' + brand.id + '/edit'" class="text-blue-600 hover:text-blue-900">{{ brand.name }}</a></div>
                  <div class="text-xs text-gray-500">{{ brand.caption }}</div>
                </div>
              </div>
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">{{ getCountryName(brand.country) }}</div>
              <div class="text-xs text-gray-500">{{ brand.country }}</div>
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
              <component-rating [rating]="brand.rating" [showValue]="true"></component-rating>
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
              <span *ngIf="brand.default" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-orange-100 text-orange-800">Default</span>
            </td>

            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <a [routerLink]="'/portal/brands/' + brand.id + '/edit'" class="text-blue-600 hover:text-blue-900 mr-3">Edit</a>
              <button (click)="onDeleteBrand(brand)" class="text-red-600 hover:text-red-900 cursor-pointer">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
