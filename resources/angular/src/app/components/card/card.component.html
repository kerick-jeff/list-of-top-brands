<div class="card group h-full relative overflow-hidden transition-all duration-300 hover:scale-[1.02] hover:shadow-lg">
  <div *ngIf="brand.default" class="absolute top-2 right-2 bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded-full">Default</div>
  <div class="p-4">
    <div class="flex items-center mb-3">
      <div class="mr-3">
        <component-image [brandName]="brand.name" [size]="'sm'"></component-image>
      </div>

      <div>
        <h3 class="text-lg font-medium text-gray-900">{{ brand.name }}</h3>
        <p class="text-sm text-gray-500">{{ getCountryName(brand.country) }}</p>
      </div>
    </div>

    <p class="text-sm italic text-gray-700 mb-3">"{{ brand.caption }}"</p>

    <div class="mb-3">
      <component-rating [rating]="brand.rating" [showValue]="true"></component-rating>
    </div>

    <p class="text-sm text-gray-600 mb-4 line-clamp-2">{{ brand.description }}</p>

    <div class="flex justify-between mt-auto">
      <a [routerLink]="['/brands', brand.slug]" class="text-sm font-medium text-blue-600 hover:text-blue-800">View Details</a>
      <a [href]="brand.website" target="_blank" rel="noopener noreferrer" class="text-sm font-medium text-gray-600 hover:text-gray-800">Visit Website →</a>
    </div>
  </div>
</div>
